name: Manual Build and Update

on:
  push:
    paths:
      - 'herodata_*_kokr.json'
  workflow_dispatch:  # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 이 권한이 있어야 파일을 다시 쓸 수 있습니다.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Script
        run: python make_build.py
      
      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .    # 새로 만들어진 모든 html 파일을 추적합니다.
          git commit -m "Auto update build files" || echo "No changes to commit"
          git push     # 저장소에 실제로 반영합니다.
