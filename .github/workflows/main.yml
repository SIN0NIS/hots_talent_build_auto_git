name: Manual Build and Update

on:
  push:
    paths:
      - 'herodata_*_kokr.json'
  workflow_dispatch:  # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v3에서 v4로 업데이트 (Node.js 20 경고 해결)

      - name: Set up Python
        uses: actions/setup-python@v5 # v4에서 v5로 업데이트 (Node.js 20 경고 해결)
        with:
          python-version: '3.11' # 최신 라이브러리 호환성을 위해 3.11 권장

      - name: Run Script
        run: python make_build.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Manual update from GitHub UI" || echo "No changes to commit"
          git push
